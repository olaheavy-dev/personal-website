name: CI

on:
  pull_request:
    # "edited" re-runs the checks when a PR title or description changes (dash check below).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Run every automated check
        run: make check

      # After make check, which installs the dependencies the checker needs (TypeScript).
      - name: Check the PR title and description for dashes (decision 0014)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-dashes.mjs --env PR_TITLE,PR_BODY

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: .artifacts/coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Runs in the same pinned Playwright image as the visual job below, so the browser and its
    # system packages are already installed. (`playwright install --with-deps` took 10 to 12
    # minutes on 27 Oct 2026, waiting on the apt mirrors, issue #122.) Keep the image in step
    # with @playwright/test: the "Check the container matches" step fails if it drifts, and
    # the visual job's image must be bumped in the same change.
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      HOME: /root
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Playwright image has no make, so these steps call what the make targets run
      # (see the Makefile: build, e2e, e2e-flags, e2e-speed, e2e-cold).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the container matches the Playwright version
        run: ./scripts/check-playwright-container.sh

      - name: Build for production
        run: node e2e/fixtures/with-fake-supabase.mjs pnpm build

      - name: Run browser journeys and axe checks
        run: pnpm test:e2e --grep-invert "@visual|@flags|@cold|@speed"

      # They change the flags the site reads, so they run alone, one at a time (make e2e-flags).
      - name: Run the feature flag journeys
        run: pnpm test:e2e --grep @flags --workers=1 --project=desktop-light --project=small-phone

      # Measures the home LCP under Lighthouse's mobile throttling, so it runs alone (make e2e-speed).
      - name: Run the home speed measurement
        run: pnpm test:e2e --grep @speed --workers=1 --project=mobile

      # Builds its own build with every flagged page Off, so it runs last (make e2e-cold).
      - name: Run the cold start journey
        run: ./scripts/e2e-cold.sh

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: make install

      # Local Postgres in Docker (no API, auth or studio): reset from the migrations and
      # seed, run the pgTAP tests, lint the schema, and check the generated types are
      # up to date. No hosted project and no secret is involved.
      - name: Check the database
        run: make db-check

      # A new migration older than the newest one on main would make `supabase db push` fail
      # on every publish (decision 0019). Fetches the tip of main itself (shallow checkout).
      - name: New migrations are newer than main's
        run: make migration-order

  visual:
    name: visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Screenshots are compared only on Linux, inside the official Playwright image, so
    # fonts and anti-aliasing match the committed baselines (e2e/__screenshots__/*-linux.png).
    # Tag v1.64.1-noble, multi-arch index digest. Keep it in step with @playwright/test
    # (the "Check the container matches" step fails if it drifts).
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      HOME: /root
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Playwright image has no make, so these steps call what the make targets run.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The image ships the browsers for one Playwright version; fail if the package and the
      # image tag disagree (see the script).
      - name: Check the container matches the Playwright version
        run: ./scripts/check-playwright-container.sh

      # Reads the flags from the fake Supabase server, as make build does.
      - name: Build for production
        run: node e2e/fixtures/with-fake-supabase.mjs pnpm build

      - name: Compare screenshots with the baselines
        id: compare
        run: pnpm test:e2e --grep @visual

      # Everything below runs only if the comparison failed. The artifacts let a person
      # review the diffs and accept them with `make visual-accept RUN=<run id>`.
      - name: Upload the diff images
        if: ${{ failure() && steps.compare.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Regenerates only the baselines that failed (passing ones keep their committed
      # bytes, so accepting brings no churn). This step cannot make the job pass:
      # the compare step already failed, so the job stays red whatever happens here.
      - name: Propose new baselines
        if: ${{ failure() && steps.compare.outcome == 'failure' }}
        run: pnpm exec playwright test --grep @visual --update-snapshots=changed

      - name: Upload the proposed baselines
        if: ${{ failure() && steps.compare.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    # Builds the production image from the real build context (.dockerignore applied), so a file
    # the image cannot see breaks the PR instead of the publish run after merge. A smoke build:
    # no Supabase values, so gated pages are baked Off; it is never pushed.
    name: docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image and check it for private files and a root user
        run: make docker-build && make docker-check
