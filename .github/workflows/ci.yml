name: CI

on:
  pull_request:
    # "edited" re-runs the checks when a PR title or description changes (dash check below).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Run every automated check
        run: make check

      # After make check, which installs the dependencies the checker needs (TypeScript).
      - name: Check the PR title and description for dashes (decision 0014)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-dashes.mjs --env PR_TITLE,PR_BODY

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: .artifacts/coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: make install

      - name: Install the Playwright browser
        run: make e2e-install

      - name: Build for production
        run: make build

      - name: Run browser journeys and axe checks
        run: make e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: make install

      # Local Postgres in Docker (no API, auth or studio): reset from the migrations and
      # seed, run the pgTAP tests, lint the schema, and check the generated types are
      # up to date. No hosted project and no secret is involved.
      - name: Check the database
        run: make db-check

  visual:
    name: visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Screenshots are compared only on Linux, inside the official Playwright image, so
    # fonts and anti-aliasing match the committed baselines (e2e/__screenshots__/*-linux.png).
    # Tag v1.64.1-noble, multi-arch index digest. Keep it in step with @playwright/test
    # (the "Check the container matches" step fails if it drifts).
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      HOME: /root
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Playwright image has no make, so these steps call what the make targets run.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The image ships the browsers for one Playwright version. Ask the installed
      # @playwright/test where it expects its browsers (a dry run downloads nothing) and
      # fail if any of those folders is missing from the image. That is true exactly when
      # the package and the image tag disagree, for example after a Dependabot bump.
      - name: Check the container matches the Playwright version
        run: |
          set -eu
          missing=0
          for dir in $(pnpm exec playwright install --dry-run chromium | sed -n 's/^ *Install location: *//p'); do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing $dir. The Playwright image in ci.yml does not match @playwright/test in package.json. Update the image tag and digest to the same version."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build for production
        run: pnpm build

      - name: Compare screenshots with the baselines
        id: compare
        run: pnpm test:e2e --grep @visual

      # Everything below runs only if the comparison failed. The artifacts let a person
      # review the diffs and accept them with `make visual-accept RUN=<run id>`.
      - name: Upload the diff images
        if: ${{ failure() && steps.compare.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Regenerates only the baselines that failed (passing ones keep their committed
      # bytes, so accepting brings no churn). This step cannot make the job pass:
      # the compare step already failed, so the job stays red whatever happens here.
      - name: Propose new baselines
        if: ${{ failure() && steps.compare.outcome == 'failure' }}
        run: pnpm exec playwright test --grep @visual --update-snapshots=changed

      - name: Upload the proposed baselines
        if: ${{ failure() && steps.compare.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore
