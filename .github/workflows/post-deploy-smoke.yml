# After the image is published, wait for Watchtower to roll it out, then run the browser
# journeys and axe checks against the live staging URL (decision 0003). A failure leaves the
# previous sha- tag available for rollback.
name: Post-deploy smoke

on:
  # Only follows the publish workflow on main; it tests the live URL and runs no pull request code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Publish image]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://staging.olaheavy.dev

jobs:
  smoke:
    name: Live smoke
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The same pinned Playwright image as the e2e and visual jobs in ci.yml, so the browser
    # is preinstalled (`playwright install --with-deps` waited on the apt mirrors for 10 to
    # 12 minutes on 27 Oct 2026, issue #122). The digest appears in three places (the visual
    # and e2e jobs in ci.yml, and here); bump all three with @playwright/test. The "Check the
    # container matches" step fails if the image and the package drift, and `make check`
    # (scripts/check-playwright-image.mjs) fails if the three digests differ. The image has
    # git, curl, sed and seq, which the steps below use. Steps in a container job run with
    # sh, not bash.
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      HOME: /root
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Test with the code of the deployed commit, not whatever main is now.
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The job runs as root in the container but the workspace belongs to the runner user, and
      # actions/checkout removes its own temporary safe.directory entry when it finishes, so
      # without this the git commands in the next step fail with "dubious ownership".
      # HOME is /root, so the setting persists for the rest of the job.
      - name: Let git read the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # If a newer commit reaches the site first (two merges close together), this run stops
      # cleanly: the newer commit's own smoke run tests it.
      - name: Wait for the commit to go live (up to 15 minutes)
        id: wait
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then exit 0; fi
          git fetch --quiet origin main
          for _ in $(seq 1 90); do
            live=$(curl -sf "$BASE_URL/healthz" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)
            if [ "$live" = "$EXPECTED_SHA" ]; then echo "live: $live"; exit 0; fi
            if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$EXPECTED_SHA" "$live"; then
              echo "::notice::A newer commit ($live) is live; its own smoke run tests it."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deploy did not reach $BASE_URL within 15 minutes (live: ${live:-unreachable})"
          exit 1

      # The same check the publish workflow made on the candidate image, now on the live site.
      - name: The live site has the Supabase values built in
        if: ${{ steps.wait.outputs.superseded != 'true' }}
        run: curl -sf "$BASE_URL/healthz" | grep -q '"supabase":"configured"'

      - name: Staging is hidden from search engines
        if: ${{ steps.wait.outputs.superseded != 'true' }}
        run: |
          curl -sfI "$BASE_URL/" | grep -i '^x-robots-tag: .*noindex'
          curl -sf "$BASE_URL/robots.txt" | grep -qx 'Disallow: /'

      - name: Set up pnpm (version from package.json)
        if: ${{ steps.wait.outputs.superseded != 'true' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        if: ${{ steps.wait.outputs.superseded != 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Playwright image has no make, so these steps call what the make targets run.
      - name: Install dependencies
        if: ${{ steps.wait.outputs.superseded != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Check the container matches the Playwright version
        if: ${{ steps.wait.outputs.superseded != 'true' }}
        run: ./scripts/check-playwright-container.sh

      - name: Browser journeys and axe against the live URL
        if: ${{ steps.wait.outputs.superseded != 'true' }}
        env:
          E2E_BASE_URL: ${{ env.BASE_URL }}
        run: pnpm test:e2e --grep-invert "@visual|@flags|@cold|@speed"

      - name: Keep the Playwright report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
