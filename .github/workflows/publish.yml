# Publish the image to GHCR only after CI passes on main (decision 0003).
# Watchtower on the VPS (scope personal-website-staging) rolls out the new :main image.
# Pull requests never publish.
name: Publish image

on:
  # Only runs for CI on main and checks out main itself, never code from a pull request.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build, check and push
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      # Check out main itself, never a ref taken from the triggering run, then refuse to publish
      # unless main still points at the commit CI just checked. A newer commit publishes itself.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Main still points at the commit CI checked
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$CHECKED_SHA" ]; then
            echo "::error::main moved on since CI checked $CHECKED_SHA; the newer commit's CI run will publish."
            exit 1
          fi

      # NEXT_PUBLIC_* values are written into the build, so an image built without them would
      # show every gated page as Off. Fail here, before the slow build, naming the variables.
      - name: Supabase build values are present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-build-env.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the candidate image (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: |
            BUILD_SHA=${{ github.event.workflow_run.head_sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          tags: personal-website:candidate

      - name: Refuse to publish an image with private files or a root user
        run: bash scripts/check-image.sh personal-website:candidate

      - name: Serve /healthz from the candidate image
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker run -d --name candidate -p 127.0.0.1:3000:3000 personal-website:candidate
          for _ in $(seq 1 30); do
            body=$(curl -sf http://127.0.0.1:3000/healthz || true)
            if [ -n "$body" ]; then break; fi
            sleep 1
          done
          echo "healthz: $body"
          if ! echo "$body" | grep -q "\"sha\":\"$CHECKED_SHA\""; then
            docker logs candidate
            docker rm -f candidate >/dev/null
            exit 1
          fi
          docker rm -f candidate >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push exactly the image that was checked
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/personal-website
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for tag in "sha-$SHA" main; do
            docker tag personal-website:candidate "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
